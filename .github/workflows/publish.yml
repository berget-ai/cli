name: Publish to NPM

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:run

      - name: Build project
        run: npm run build

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # OIDC trusted publishing (npmjs.com → berget → Trusted Publisher:
      # berget-ai/cli / publish.yml). No NPM_TOKEN needed — the old classic
      # token expired, which made npm publish fail with a misleading 404.
      id-token: write
    steps:
      # The repo ruleset requires PRs for GITHUB_TOKEN pushes to main.
      # Checking out with the repo Deploy Key (SSH) makes the version-bump
      # push below bypass the ruleset, same as api/console/chat release.yml.
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Bump version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npm version ${{ inputs.bump }} -m "release: %s"
          git push --follow-tags

      - name: Publish to NPM (OIDC trusted publishing)
        run: |
          npm install -g npm@latest   # OIDC trusted publishing needs npm >= 11.5.1
          npm publish
